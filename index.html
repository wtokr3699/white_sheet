<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>배경 흰색 채우기</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      color: #222;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 36px;
      text-align: center;
    }

    .drop-zone {
      width: 100%;
      max-width: 560px;
      border: 2px dashed #bbb;
      border-radius: 16px;
      background: #fff;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .drop-zone.dragover {
      border-color: #4a90e2;
      background: #f0f7ff;
    }

    .drop-zone .icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .drop-zone p {
      font-size: 1rem;
      color: #555;
      margin-bottom: 16px;
    }

    .drop-zone span {
      font-size: 0.8rem;
      color: #999;
    }

    #fileInput {
      display: none;
    }

    .btn {
      display: inline-block;
      padding: 10px 24px;
      background: #4a90e2;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
    }

    .btn:hover {
      background: #2f74cc;
    }

    .btn.download {
      background: #27ae60;
      margin-top: 20px;
      font-size: 1rem;
      padding: 12px 32px;
    }

    .btn.download:hover {
      background: #1e8449;
    }

    .result-section {
      width: 100%;
      max-width: 560px;
      margin-top: 36px;
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .result-section.visible {
      display: flex;
    }

    .preview-wrap {
      width: 100%;
      background: repeating-conic-gradient(#ccc 0% 25%, #fff 0% 50%) 0 0 / 16px 16px;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .preview-wrap img {
      max-width: 100%;
      display: block;
    }

    .info {
      margin-top: 10px;
      font-size: 0.82rem;
      color: #888;
      text-align: center;
    }

    .processing {
      margin-top: 24px;
      font-size: 0.95rem;
      color: #4a90e2;
      display: none;
    }

    canvas {
      display: none;
    }
  </style>
</head>
<body>

  <h1>악보 배경 흰색 채우기</h1>
  <p class="subtitle">누끼 이미지를 업로드하면 배경을 흰색으로 채워 다운로드할 수 있어요.<br>모든 처리는 브라우저에서만 이루어지며 서버로 전송되지 않습니다.</p>

  <div class="drop-zone" id="dropZone">
    <div class="icon">🎼</div>
    <p>이미지를 여기에 끌어다 놓거나</p>
    <button class="btn" onclick="document.getElementById('fileInput').click()">파일 선택</button>
    <br /><br />
    <span>PNG · JPG · WEBP · GIF 지원</span>
    <input type="file" id="fileInput" accept="image/*" />
  </div>

  <p class="processing" id="processing">처리 중...</p>

  <div class="result-section" id="resultSection">
    <div class="preview-wrap">
      <img id="previewImg" src="" alt="결과 미리보기" />
    </div>
    <p class="info" id="infoText"></p>
    <button class="btn download" id="downloadBtn">다운로드</button>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const resultSection = document.getElementById('resultSection');
    const previewImg = document.getElementById('previewImg');
    const downloadBtn = document.getElementById('downloadBtn');
    const infoText = document.getElementById('infoText');
    const processing = document.getElementById('processing');

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        processFile(file);
      }
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) {
        processFile(fileInput.files[0]);
      }
    });

    function processFile(file) {
      processing.style.display = 'block';
      resultSection.classList.remove('visible');

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          // 원본 크기 그대로 캔버스 설정
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;

          // 흰색 배경 먼저 채우기
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // 원본 이미지 위에 그리기
          ctx.drawImage(img, 0, 0);

          // 출력 포맷 결정 (원본 형식 유지, PNG 기본)
          let mimeType = file.type;
          let ext = file.name.split('.').pop().toLowerCase();

          // WEBP/GIF는 PNG로 폴백 (canvas toBlob 지원 여부)
          if (mimeType === 'image/gif') {
            mimeType = 'image/png';
            ext = 'png';
          }
          if (!['image/png', 'image/jpeg', 'image/webp'].includes(mimeType)) {
            mimeType = 'image/png';
            ext = 'png';
          }

          const quality = mimeType === 'image/jpeg' ? 0.95 : undefined;

          canvas.toBlob((blob) => {
            const url = URL.createObjectURL(blob);

            // 미리보기
            previewImg.src = url;

            const baseName = file.name.replace(/\.[^/.]+$/, '');
            const outName = `${baseName}_white.${ext}`;

            downloadBtn.onclick = async () => {
              // iOS Safari 등 모바일: Web Share API로 공유/저장
              if (navigator.share && navigator.canShare) {
                const shareFile = new File([blob], outName, { type: mimeType });
                if (navigator.canShare({ files: [shareFile] })) {
                  try {
                    await navigator.share({ files: [shareFile], title: outName });
                    return;
                  } catch (e) {
                    if (e.name === 'AbortError') return;
                  }
                }
              }
              // 데스크탑 / Android Chrome: a[download] 방식
              const a = document.createElement('a');
              a.href = url;
              a.download = outName;
              a.click();
            };

            downloadBtn.textContent = `다운로드 (${outName})`;

            const kb = (blob.size / 1024).toFixed(1);
            infoText.textContent = `${img.naturalWidth} × ${img.naturalHeight}px · ${kb} KB · ${ext.toUpperCase()}`;

            processing.style.display = 'none';
            resultSection.classList.add('visible');
          }, mimeType, quality);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
